# CSP du serveur de développement Vite. Seule différence avec csp-static.conf : rien de plus n'est autorisé,
# les balises <script>/<style> injectées par Vite portent le nonce (html.cspNonce) ; le WebSocket du
# rechargement à chaud est sur la même origine ('self').
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
