# Frontend construit (npm run build), servi tel quel : environnement E2E et préfiguration du déploiement.
root /srv/frontend;

location = /index.html {
    add_header Cache-Control "no-store" always;
    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter "RBI_CSP_NONCE" $request_id;
    include /etc/nginx/rbi/headers-frontend.conf;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/rbi/headers-frontend.conf;
    try_files $uri =404;
}

location / {
    include /etc/nginx/rbi/headers-frontend.conf;
    try_files $uri /index.html;
}
