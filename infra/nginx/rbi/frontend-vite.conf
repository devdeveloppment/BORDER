# Développement : serveur Vite (conteneur frontend) avec rechargement à chaud (WebSocket sur la même origine).
# CONFIGURATION DE DÉVELOPPEMENT : jamais à utiliser en production.
location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";        # réponse non compressée : substitution du nonce possible
    proxy_read_timeout 1h;                      # WebSocket du rechargement à chaud
    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter "RBI_CSP_NONCE" $request_id;     # nonce posé par Vite (html.cspNonce) sur ses balises
    include /etc/nginx/rbi/headers-frontend.conf;
}
