# API Django (/api/) — commun aux modes HTTP et TLS (P2.10, ADR 0012).
# En-têtes de transfert REMPLACÉS (jamais complétés) : une valeur envoyée par le client n'atteint pas l'API.
location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;              # validé par ALLOWED_HOSTS ; port conservé (contrôle CSRF)
    proxy_set_header X-Forwarded-For $remote_addr;  # remplace : adresse du pair de Nginx uniquement
    proxy_set_header X-Forwarded-Proto $scheme;     # cru par Django seulement venant de ce proxy (RBI_TRUSTED_PROXIES)
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Request-ID "";               # généré par l'API, jamais par le client (P2.7)
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;                         # export CSV borné à 10 000 lignes
    client_max_body_size 64k;                       # = RBI_API_MAX_BODY_BYTES
    proxy_intercept_errors off;                     # erreurs de l'API : déjà au format RFC 9457
    error_page 413 = @api_too_large;
    error_page 502 503 504 = @api_unavailable;
    include /etc/nginx/rbi-run/transport.conf;
}

location @api_too_large {
    default_type application/problem+json;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rbi-run/transport.conf;
    return 413 '{"type": "about:blank", "title": "Requête trop volumineuse", "status": 413}';
}

location @api_unavailable {
    default_type application/problem+json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "10" always;
    include /etc/nginx/rbi-run/transport.conf;
    return 503 '{"type": "about:blank", "title": "Service momentanément indisponible", "status": 503, "detail": "Veuillez réessayer dans un instant."}';
}
