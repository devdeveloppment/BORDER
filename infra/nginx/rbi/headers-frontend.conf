# En-têtes de sécurité des réponses du frontend (le backend pose les siens sur /api/).
# CSP stricte : aucun script ni style en ligne hors nonce par requête ($request_id, 128 bits) ; ressources de
# la même origine uniquement ; aucune intégration dans un cadre. Variante par mode : csp-<mode>.conf.
include /etc/nginx/rbi-run/csp.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
include /etc/nginx/rbi-run/transport.conf;
