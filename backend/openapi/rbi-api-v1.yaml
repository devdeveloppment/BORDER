components:
  schemas:
    AccessRequest:
      type: object
      description: Contrat P1 ``AccessRequest``.
      properties:
        id:
          type: string
          format: uuid
        organization_name:
          type: string
        requester_name:
          type: string
        requester_role:
          type: string
        email:
          type: string
          format: email
        request_type:
          $ref: '#/components/schemas/RequestTypeEnum'
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - email
      - id
      - organization_name
      - request_type
      - requester_name
      - requester_role
    ActionEnum:
      enum:
      - activate
      - suspend
      - reactivate
      - archive
      type: string
      description: |-
        * `activate` - activate
        * `suspend` - suspend
        * `reactivate` - reactivate
        * `archive` - archive
    ActorTypeEnum:
      enum:
      - user
      - anonymous
      - system
      type: string
      description: |-
        * `user` - utilisateur
        * `anonymous` - anonyme
        * `system` - système
    AuditEntry:
      type: object
      description: Contrat P1 ``AuditEntry`` + champs exacts du journal (``outcome``,
        ``actor_type``, ``actor_id``, …).
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        organization_id:
          type: string
          format: uuid
          nullable: true
        actor:
          type: string
          description: Adresse si lisible dans le périmètre, sinon libellé neutre.
        actor_type:
          $ref: '#/components/schemas/ActorTypeEnum'
        actor_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        result:
          allOf:
          - $ref: '#/components/schemas/ResultEnum'
          description: |-
            Contrat P1 : refus et échecs → echec.

            * `succes` - succes
            * `echec` - echec
        object_type:
          type: string
          description: Vide si l'événement ne vise pas d'objet.
        object_id:
          type: string
          nullable: true
        object_repr:
          type: string
        ip_address:
          type: string
          nullable: true
        request_id:
          type: string
          format: uuid
          nullable: true
        old_value:
          type: object
          additionalProperties: {}
          nullable: true
        new_value:
          type: object
          additionalProperties: {}
          nullable: true
        details:
          type: object
          additionalProperties: {}
        prev_hash:
          type: string
        hash:
          type: string
      required:
      - action
      - actor
      - actor_id
      - actor_type
      - created_at
      - details
      - hash
      - id
      - ip_address
      - new_value
      - object_id
      - object_repr
      - object_type
      - old_value
      - organization_id
      - outcome
      - prev_hash
      - request_id
      - result
      - scope
    AuditPage:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        chain_integrity:
          allOf:
          - $ref: '#/components/schemas/AuditPageChainIntegrityEnum'
          description: |-
            Toujours « non_verifiee » ici : la vérification complète passe par …/integrity.

            * `valide` - valide
            * `rompue` - rompue
            * `non_verifiee` - non_verifiee
      required:
      - chain_integrity
      - count
      - page
      - page_size
      - results
    AuditPageChainIntegrityEnum:
      enum:
      - valide
      - rompue
      - non_verifiee
      type: string
      description: |-
        * `valide` - valide
        * `rompue` - rompue
        * `non_verifiee` - non_verifiee
    Authorization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        scope:
          type: string
        valid_from:
          type: string
          format: date
        valid_until:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - id
      - reference
      - scope
      - valid_from
      - valid_until
    AuthorizationCreateRequest:
      type: object
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 100
        scope:
          type: string
          minLength: 1
          maxLength: 2000
        valid_from:
          type: string
          format: date
        valid_until:
          type: string
          format: date
          nullable: true
      required:
      - reference
      - scope
      - valid_from
    BackupCodesResponse:
      type: object
      properties:
        backup_codes:
          type: array
          items:
            type: string
      required:
      - backup_codes
    CodeRequestRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
      required:
      - code
    CreatedAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
      required:
      - email
      - id
    CurrentUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        organization:
          allOf:
          - $ref: '#/components/schemas/OrganizationSummary'
          nullable: true
        mfa_enabled:
          type: boolean
        mfa_required:
          type: boolean
        assigned_post_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Toujours vide tant que le module des postes n'existe pas.
        last_login:
          type: string
          format: date-time
          nullable: true
      required:
      - assigned_post_ids
      - email
      - first_name
      - id
      - last_login
      - last_name
      - mfa_enabled
      - mfa_required
      - organization
      - permissions
      - roles
    DeploymentModeEnum:
      enum:
      - mutualise
      - dedie
      type: string
      description: |-
        * `mutualise` - Mutualisé
        * `dedie` - Dédié
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    DetailResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EmailRequestRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
      required:
      - email
    EnrollmentResponse:
      type: object
      properties:
        otpauth_uri:
          type: string
        secret:
          type: string
          description: Renvoyé une seule fois, jamais journalisé.
      required:
