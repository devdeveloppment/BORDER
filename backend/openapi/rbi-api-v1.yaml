openapi: 3.0.3
info:
  title: RIZTECH Border Intelligence — API v1
  version: 1.0.0
  description: API REST de RBI (données fictives de démonstration uniquement). Session
    HttpOnly + CSRF, MFA selon le rôle, permissions RBAC évaluées côté serveur, isolation
    par organisme (RLS PostgreSQL). Erreurs au format RFC 9457 ; un objet d'un autre
    organisme renvoie 404.
paths:
  /api/v1/audit-logs:
    get:
      operationId: audit_logs_retrieve
      description: |-
        Accès : permission RBAC `audit.view`, évaluée dans le contexte serveur.

        Base de toute vue de l'API v1.
      summary: Consulter le journal de son organisme
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Catégorie (« auth ») ou action exacte.
      - in: query
        name: actor_id
        schema:
          type: string
          format: uuid
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
        description: Début inclus (ISO 8601 ou AAAA-MM-JJ).
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
        description: Fin exclue (ISO 8601 ou AAAA-MM-JJ).
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
          enum:
          - access_request
          - audit_chain
          - organization
          - organization_authorization
          - user
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -id
          - id
        description: 'Défaut : -id (récent d''abord).'
      - in: query
        name: outcome
        schema:
          type: string
          enum:
          - denied
          - failure
          - success
      - in: query
        name: page
        schema:
          type: integer
        description: ≥ 1 (défaut 1).
      - in: query
        name: page_size
        schema:
          type: integer
        description: 1 à 100 (défaut 50) ; page * page_size ≤ 10 000.
      tags:
      - Journal d'audit — organisme
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Erreur (RFC 9457)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Erreur (RFC 9457)
      x-rbi-policy: permission:audit.view
  /api/v1/audit-logs/export:
    get:
      operationId: audit_logs_export_retrieve
      description: |-
        Accès : permission RBAC `audit.view`, évaluée dans le contexte serveur.

        Opération coûteuse (proportionnelle au journal) : au plus 10 requêtes par minute et par compte,
        réponse 429 au-delà.
      summary: Exporter le journal de son organisme (CSV)
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Catégorie (« auth ») ou action exacte.
      - in: query
        name: actor_id
        schema:
          type: string
          format: uuid
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
        description: Début inclus (ISO 8601 ou AAAA-MM-JJ).
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
        description: Fin exclue (ISO 8601 ou AAAA-MM-JJ).
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
          enum:
          - access_request
          - audit_chain
          - organization
          - organization_authorization
          - user
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -id
          - id
        description: 'Défaut : -id (récent d''abord).'
      - in: query
        name: outcome
        schema:
          type: string
          enum:
          - denied
          - failure
          - success
      tags:
      - Journal d'audit — organisme
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: 'Fichier CSV (UTF-8), 10 000 lignes au plus. Première colonne
            « mention » : « DONNÉES DE DÉMONSTRATION » pour un organisme de démonstration,
            vide sinon ; journal plateforme : statut enregistré dans l''entrée, «
            STATUT INDÉTERMINÉ » si un organisme est visé sans statut établi.'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            text/csv:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Erreur (RFC 9457)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            text/csv:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Erreur (RFC 9457)
      x-rbi-policy: permission:audit.view
